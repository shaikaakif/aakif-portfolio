<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Google Site Verification</title>
    <!--
      GOOGLE SEARCH CONSOLE VERIFICATION — HTML FILE METHOD
      ------------------------------------------------------
      This file is a deploy-ready placeholder. It does NOT contain a real
      Google verification token and will NOT verify ownership as-is.

      To complete verification:
      1. Open Google Search Console and add a URL-prefix property for:
         https://shaikaakif.com/
      2. Choose the "HTML file tag" verification method.
      3. Google will give you a filename (e.g. googleABC123.html) and a
         verification token.
      4. Rename this file to the exact filename Google provided, OR create a
         new file in public/ with that exact filename.
      5. Replace the content value below with the exact token Google gave you.
      6. Commit and deploy to Vercel so the file is served at:
         https://shaikaakif.com/<google-filename>.html
      7. Return to Search Console and click "Verify".

      Do not use the HTML <meta> tag method: this is a Next.js App Router
      static export (no root index.html <head> to edit, and no custom
      document), so the HTML file method is the supported path.
    -->
    <meta
      name="google-site-verification"
      content="NIHnEue1TL8b2HySbX_uXWGb_wnUAI10A69ZjO3Rm5s"
    />
  </head>
  <body>
    <p>Google Search Console verification placeholder.</p>
    <p>
      Replace the <code>content</code> value with the actual token from
      Search Console and rename this file to the filename Google assigns.
    </p>
  </body>
</html>
